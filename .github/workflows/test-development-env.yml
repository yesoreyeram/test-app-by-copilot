name: Test Development Environment

on:
  push:
    branches: [ main, copilot/** ]
  pull_request:
    branches: [ main ]

jobs:
  test-dev-env:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Air for backend hot reload
        run: go install github.com/air-verse/air@latest

      - name: Install root dependencies
        run: npm install

      - name: Install frontend dependencies
        run: cd frontend && yarn install

      - name: Start dev servers in background
        run: |
          npm run dev &
          echo "DEV_PID=$!" >> $GITHUB_ENV
        env:
          CI: false

      - name: Wait for health endpoint (60s timeout)
        run: |
          timeout=60
          elapsed=0
          until curl -f http://localhost:3000/health || [ $elapsed -ge $timeout ]; do
            echo "Waiting for dev server health check... ($elapsed/$timeout seconds)"
            sleep 2
            elapsed=$((elapsed + 2))
          done
          if [ $elapsed -ge $timeout ]; then
            echo "Health check timed out after ${timeout} seconds"
            exit 1
          fi
          echo "Health check successful!"

      - name: Test home page loads with correct title
        run: |
          response=$(curl -s http://localhost:3000/)
          if echo "$response" | grep -q "Test App"; then
            echo "✓ Home page loaded successfully with correct title"
          else
            echo "✗ Home page title not found"
            exit 1
          fi

      - name: Test convert page loads with correct title
        run: |
          response=$(curl -s http://localhost:3000/convert/lower)
          if echo "$response" | grep -q "Test App"; then
            echo "✓ Convert page loaded successfully"
          else
            echo "✗ Convert page title not found"
            exit 1
          fi

      - name: Test math API endpoint
        run: |
          response=$(curl -s http://localhost:3000/api/math/add/1/2)
          if echo "$response" | grep -q '"output":3'; then
            echo "✓ Math API endpoint working correctly"
            echo "Response: $response"
          else
            echo "✗ Math API endpoint failed"
            echo "Response: $response"
            exit 1
          fi

      - name: Stop dev servers
        if: always()
        run: |
          # Kill all node and air processes started by the test
          pkill -f "webpack serve" || true
          pkill -f "air" || true
          pkill -f "go run" || true
          sleep 2
